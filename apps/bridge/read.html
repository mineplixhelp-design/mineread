<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Read Manga - Mineplay</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @font-face {
      font-family: 'Plus Jakarta Sans';
      src: url('font/jakarta-sans.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --md-sys-color-background: #000000;
      --md-sys-color-surface: #141414;
      --md-sys-color-surface-variant: #1a1a1a;
      --md-sys-color-primary: #ffffff;
      --md-sys-color-on-primary: #000000;
      --md-sys-color-on-background: #ffffff;
      --md-sys-color-on-surface: #ffffff;
      --md-sys-color-on-surface-variant: #9e9e9e;
      --font-family: 'Plus Jakarta Sans', sans-serif;
      --status-bar-height: env(safe-area-inset-top, 24px);
      --bottom-bar-height: env(safe-area-inset-bottom, 0px);
      --apple-ease: cubic-bezier(0.32, 0.72, 0, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      font-family: var(--font-family);
      user-select: none;
      -webkit-user-select: none;
      position: relative;
    }

    button {
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      -webkit-appearance: none;
      appearance: none;
    }

    .catalog-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(60px + env(safe-area-inset-top, 24px));
      background-color: #000000;
      display: flex;
      align-items: center;
      padding-top: env(safe-area-inset-top, 24px);
      padding-left: 16px;
      padding-right: 16px;
      gap: 12px;
      flex-shrink: 0;
      z-index: 160;
      border-bottom: 1px solid transparent;
      transition: transform 0.45s var(--apple-ease), opacity 0.45s var(--apple-ease);
      will-change: transform, opacity;
    }

    .catalog-header.page-behind {
      transform: scale(0.94);
      opacity: 0;
      pointer-events: none;
    }

    .catalog-header .back-btn, .catalog-header .sort-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      background: transparent;
      transition: background 0.2s ease;
    }

    .catalog-header .back-btn:active, .catalog-header .sort-btn:active {
      background: rgba(255, 255, 255, 0.16);
    }

    .catalog-header .back-btn svg, .catalog-header .sort-btn svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .catalog-header .back-btn svg {
      fill: #ffffff;
      stroke: none;
    }

    .catalog-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .hero-header {
      position: fixed;
      top: calc(var(--status-bar-height) + 12px);
      left: 10px;
      right: 10px;
      height: 60px;
      display: flex;
      align-items: center;
      z-index: 200;
      pointer-events: auto;
      background-color: #121212;
      border: none;
      border-radius: 999px;
      overflow: hidden;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.3s var(--apple-ease), transform 0.3s var(--apple-ease);
    }

    .hero-header.hidden {
      opacity: 0;
      transform: translateY(-20px);
      pointer-events: none;
    }

    .header-content {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      width: 100%;
      height: 100%;
      padding: 0 8px 0 12px;
    }

    .hero-header .back-btn, .mode-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      transition: background 0.2s ease;
    }

    .hero-header .back-btn:active, .mode-btn:active {
      background: rgba(255, 255, 255, 0.1);
    }

    .hero-header .back-btn svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }

    .mode-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .header-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .manga-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--md-sys-color-on-surface);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.2px;
    }

    .manga-chapter {
      font-size: 11px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
      margin-top: 1px;
    }

    .bottom-navbar {
      position: fixed;
      bottom: calc(var(--bottom-bar-height) + 12px);
      left: 10px;
      right: 10px;
      height: 60px;
      background-color: #121212;
      border: none;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      z-index: 200;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.3s var(--apple-ease), transform 0.3s var(--apple-ease);
    }

    .bottom-navbar.hidden {
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: background 0.2s ease;
    }

    .nav-btn:active {
      background: rgba(255, 255, 255, 0.16);
    }

    .nav-btn svg {
      width: 16px;
      height: 16px;
      fill: #ffffff;
    }

    .page-indicator {
      font-size: 12px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface-variant);
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 14px;
      border-radius: 999px;
      letter-spacing: 0.5px;
    }

    .chapter-select-view {
      position: absolute;
      top: calc(60px + env(safe-area-inset-top, 24px));
      left: 0;
      width: 100%;
      height: calc(100vh - (60px + env(safe-area-inset-top, 24px)));
      background-color: var(--md-sys-color-background);
      z-index: 150;
      overflow-y: auto;
      padding: 16px 16px calc(var(--bottom-bar-height) + 20px) 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.45s var(--apple-ease), opacity 0.45s var(--apple-ease);
      will-change: transform, opacity;
      transform-origin: center center;
    }

    .chapter-select-view.page-behind {
      transform: scale(0.92);
      opacity: 0;
      pointer-events: none;
    }

    .chapter-select-container {
      width: 100%;
      max-width: 600px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .chapter-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      flex: 1;
    }

    .chapter-card {
      background: var(--md-sys-color-surface);
      padding: 18px 20px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s ease, border-color 0.2s;
      width: 100%;
      position: relative;
      overflow: hidden;
      border-radius: 24px;
    }

    .chapter-card.status-active {
      background: #1e1e1e;
    }

    .chapter-card.status-read {
      opacity: 0.65;
    }

    .chapter-info-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chapter-card-name {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      text-transform: capitalize;
    }

    .chapter-card-count {
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
    }

    .chapter-status-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-reading {
      background: #ffffff;
      color: #000000;
    }

    .badge-read {
      background: rgba(255, 255, 255, 0.12);
      color: #9e9e9e;
    }

    .ripple-effect {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transform: scale(0);
      animation: smoothRipple 0.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes smoothRipple {
      0% { transform: scale(0); opacity: 0.5; }
      100% { transform: scale(2.5); opacity: 0; }
    }

    .main-scroll-area {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      background-color: var(--md-sys-color-background);
      z-index: 180;
      transform: translateX(100%);
      transition: transform 0.45s var(--apple-ease);
      will-change: transform;
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.8);
      pointer-events: none;
    }

    .main-scroll-area.active-reader {
      transform: translateX(0);
      pointer-events: auto;
    }

    .main-scroll-area::-webkit-scrollbar {
      display: none;
    }

    .reader-container {
      width: 100%;
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: var(--md-sys-color-background);
    }

    .main-scroll-area.slide-mode {
      overflow-y: hidden !important;
      overflow-x: auto !important;
      scroll-snap-type: x mandatory;
      display: flex !important;
      flex-direction: row !important;
    }

    .main-scroll-area.slide-mode .reader-container {
      display: flex !important;
      flex-direction: row !important;
      max-width: none !important;
      width: max-content !important;
      height: 100% !important;
      min-height: 100% !important;
      align-items: center !important;
    }

    .image-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--md-sys-color-background);
    }

    .main-scroll-area:not(.slide-mode) .image-wrapper {
      width: 100% !important;
      height: auto !important;
      min-height: 300px;
    }

    .main-scroll-area.slide-mode .image-wrapper {
      width: 100vw !important;
      height: 100vh !important;
      scroll-snap-align: center;
      flex-shrink: 0;
    }

    .loading-splash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      min-height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--md-sys-color-background);
      z-index: 1;
    }

    .loading-splash img {
      width: 120px;
      height: 120px;
      object-fit: contain;
    }

    .manga-image {
      display: block;
      opacity: 0;
      z-index: 2;
      position: relative;
      transition: opacity 0.3s ease;
    }

    .main-scroll-area:not(.slide-mode) .manga-image {
      width: 100% !important;
      height: auto !important;
      max-width: 100% !important;
      max-height: none !important;
      object-fit: unset !important;
    }

    .main-scroll-area.slide-mode .manga-image {
      width: 100% !important;
      height: 100% !important;
      max-height: 100vh !important;
      object-fit: contain !important;
    }

    .manga-image.loaded {
      opacity: 1;
    }

    .error-card {
      width: 100%;
      max-width: 420px;
      margin: auto;
      padding: 32px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .error-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.2px;
    }

    .error-desc {
      font-size: 12.5px;
      font-weight: 400;
      color: #9e9e9e;
      line-height: 1.6;
      margin: 0;
    }

    .id-box {
      margin-top: 14px;
      background: #1a1a1a;
      border-radius: 18px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .id-text {
      font-size: 12px;
      color: #ffffff;
      font-weight: 600;
      font-family: monospace;
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .copy-btn:active {
      background: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>

  <div class="catalog-header" id="catalogHeader">
    <button class="back-btn" id="catalogBackBtn" title="Kembali">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="#ffffff"/></svg>
    </button>
    <div class="catalog-title" id="navCatalogTitle"></div>
    <button class="sort-btn" id="sortBtn" title="Urutkan Chapter">
      <svg id="sortIconDesc" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6h16" />
        <path d="M4 12h10" />
        <path d="M4 18h4" />
        <path d="M17 20l4-4m-4 4l-4-4m4 4V10" />
      </svg>
      <svg id="sortIconAsc" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
        <path d="M4 6h4" />
        <path d="M4 12h10" />
        <path d="M4 18h16" />
        <path d="M17 4l4 4m-4-4l-4 4m4-4v10" />
      </svg>
    </button>
  </div>

  <div class="chapter-select-view" id="chapterSelectView">
    <div class="chapter-select-container">
      <div class="chapter-grid" id="chapterGrid"></div>
    </div>
  </div>

  <div class="hero-header hidden" id="heroHeader">
    <div class="header-content">
      <button class="back-btn" id="backBtn" title="Kembali">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="#ffffff"/></svg>
      </button>
      <div class="header-info">
        <div class="manga-title" id="mangaTitle"></div>
        <div class="manga-chapter" id="mangaChapter"></div>
      </div>
      <button class="mode-btn" id="modeBtn" title="Ubah Mode Baca">
        <svg id="modeIconWebtoon" viewBox="0 0 24 24"><path d="M12 3v18M7 8l5-5 5 5M7 16l5 5 5-5"/></svg>
        <svg id="modeIconSlide" viewBox="0 0 24 24" style="display:none;"><path d="M3 12h18M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg>
      </button>
    </div>
  </div>

  <div class="main-scroll-area" id="mainScrollArea">
    <div class="reader-container" id="readerContainer"></div>
  </div>

  <div class="bottom-navbar hidden" id="bottomNavbar">
    <button class="nav-btn" id="prevChapterBtn">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="#ffffff"/></svg>
      <span>Prev</span>
    </button>
    
    <div class="page-indicator" id="pageIndicator">- / -</div>

    <button class="nav-btn" id="nextChapterBtn">
      <span>Next</span>
      <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" fill="#ffffff"/></svg>
    </button>
  </div>

  <script>
    const SUPABASE_URL = 'https://svyqklceysmpvkktavou.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_-9Q7DxILIR54gV7jCBAy7g_VLAokyF3';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentMangaData = null;
    let currentChapterKeys = [];
    let currentChapterIndex = 0;
    let isSortDesc = true;

    let isSlideMode = localStorage.getItem('mineplay_reader_mode') === 'slide';
    let totalPages = 0;
    let currentPage = 1;
    let isReaderOpen = false;
    let imageLoadQueue = [];

    function getMangaHashId() {
      return window.location.hash.replace('#baca', '').replace('#', '').trim();
    }

    function getMangaHistory() {
      const hashId = getMangaHashId();
      if (!hashId) return { lastChapter: null, lastPage: 1, readChapters: [] };
      const raw = localStorage.getItem(`manga_histori_${hashId}`);
      if (!raw) return { lastChapter: null, lastPage: 1, readChapters: [] };
      try {
        return JSON.parse(raw);
      } catch (e) {
        return { lastChapter: null, lastPage: 1, readChapters: [] };
      }
    }

    function saveMangaHistory(chapterName, pageNumber) {
      const hashId = getMangaHashId();
      if (!hashId || !chapterName) return;

      const history = getMangaHistory();
      history.lastChapter = chapterName;
      history.lastPage = pageNumber;

      if (!history.readChapters) history.readChapters = [];
      if (!history.readChapters.includes(chapterName)) {
        history.readChapters.push(chapterName);
      }

      localStorage.setItem(`manga_histori_${hashId}`, JSON.stringify(history));
      
      const historyKey = `histori:${hashId}:chapter=${chapterName}:${pageNumber}`;
      localStorage.setItem(`histori_${hashId}`, historyKey);
    }

    function getErrorHtml(id) {
      const displayId = id || 'Tidak diketahui';
      return `
        <div class="error-card">
          <div class="error-title">Database Belum Tersedia</div>
          <div class="error-desc">Informasi tentang manga di database belum tersedia. Mohon hubungi admin atau jadilah sukarela untuk membantu melengkapi database manga kami.</div>
          <div class="id-box">
            <span class="id-text">ID: ${displayId}</span>
            <button class="copy-btn" onclick="copyToClipboard('${displayId}', this)">Salin</button>
          </div>
        </div>
      `;
    }

    function copyToClipboard(text, btnElement) {
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btnElement.textContent;
        btnElement.textContent = 'Tersalin!';
        setTimeout(() => {
          btnElement.textContent = originalText;
        }, 2000);
      }).catch(err => {
        console.error('Gagal menyalin text: ', err);
      });
    }

    function handleSystemBack() {
      if (window.Android && typeof window.Android.finish === 'function') {
        window.Android.finish();
      } else if (window.Android && typeof window.Android.goBack === 'function') {
        window.Android.goBack();
      } else if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'index.html';
      }
    }

    function applyRippleToElement(element) {
      element.addEventListener('pointerdown', (e) => {
        const oldRipple = element.querySelector('.ripple-effect');
        if (oldRipple) oldRipple.remove();

        const rect = element.getBoundingClientRect();
        const diameter = Math.max(rect.width, rect.height);
        const radius = diameter / 2;

        let clientX = e.clientX;
        let clientY = e.clientY;

        if (e.type === 'touchstart' && e.touches && e.touches[0]) {
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
        }

        if (clientX === undefined) clientX = rect.left + rect.width / 2;
        if (clientY === undefined) clientY = rect.top + rect.height / 2;

        const circle = document.createElement('span');
        circle.style.width = circle.style.height = `${diameter}px`;
        circle.style.left = `${clientX - rect.left - radius}px`;
        circle.style.top = `${clientY - rect.top - radius}px`;
        circle.classList.add('ripple-effect');

        element.appendChild(circle);

        setTimeout(() => {
          if (circle && circle.parentNode) circle.remove();
        }, 500);
      });
    }

    const header = document.getElementById('heroHeader');
    const catalogHeader = document.getElementById('catalogHeader');
    const navCatalogTitle = document.getElementById('navCatalogTitle');
    const bottomNavbar = document.getElementById('bottomNavbar');
    const scrollArea = document.getElementById('mainScrollArea');
    const modeBtn = document.getElementById('modeBtn');
    const modeIconWebtoon = document.getElementById('modeIconWebtoon');
    const modeIconSlide = document.getElementById('modeIconSlide');
    const pageIndicator = document.getElementById('pageIndicator');
    const chapterSelectView = document.getElementById('chapterSelectView');
    const chapterGrid = document.getElementById('chapterGrid');
    const sortBtn = document.getElementById('sortBtn');
    const sortIconDesc = document.getElementById('sortIconDesc');
    const sortIconAsc = document.getElementById('sortIconAsc');

    document.getElementById('catalogBackBtn').addEventListener('click', () => {
      handleSystemBack();
    });

    document.getElementById('backBtn').addEventListener('click', () => {
      if (isReaderOpen) {
        window.history.back();
      } else {
        handleSystemBack();
      }
    });

    document.getElementById('prevChapterBtn').addEventListener('click', () => {
      if (currentChapterIndex > 0) {
        openChapterByIndex(currentChapterIndex - 1, true, 1);
      }
    });

    document.getElementById('nextChapterBtn').addEventListener('click', () => {
      if (currentChapterIndex < currentChapterKeys.length - 1) {
        openChapterByIndex(currentChapterIndex + 1, true, 1);
      }
    });

    sortBtn.addEventListener('click', () => {
      isSortDesc = !isSortDesc;
      sortIconDesc.style.display = isSortDesc ? 'block' : 'none';
      sortIconAsc.style.display = isSortDesc ? 'none' : 'block';
      
      if (currentMangaData) {
        renderChapterGrid();
      }
    });

    function toggleNavbars(show) {
      if (show) {
        header.classList.remove('hidden');
        bottomNavbar.classList.remove('hidden');
      } else {
        header.classList.add('hidden');
        bottomNavbar.classList.add('hidden');
      }
    }

    scrollArea.addEventListener('scroll', () => {
      if (!isReaderOpen) return;
      
      const currentChapterName = currentChapterKeys[currentChapterIndex];

      if (isSlideMode) {
        const scrollLeft = scrollArea.scrollLeft;
        const width = scrollArea.clientWidth;
        if (width > 0) {
          currentPage = Math.round(scrollLeft / width) + 1;
          pageIndicator.textContent = `${currentPage} / ${totalPages}`;
          saveMangaHistory(currentChapterName, currentPage);
        }
      } else {
        const scrollTop = scrollArea.scrollTop;

        const images = document.querySelectorAll('.manga-image');
        images.forEach((img, idx) => {
          const rect = img.getBoundingClientRect();
          if (rect.top <= window.innerHeight / 2 && rect.bottom >= 0) {
            currentPage = idx + 1;
          }
        });
        pageIndicator.textContent = `${currentPage} / ${totalPages}`;
        saveMangaHistory(currentChapterName, currentPage);

        if (scrollTop > 50) {
          toggleNavbars(false);
        } else {
          toggleNavbars(true);
        }
      }
    }, { passive: true });

    scrollArea.addEventListener('click', (e) => {
      if (!isReaderOpen) return;
      const windowHeight = window.innerHeight;
      const clickY = e.clientY;
      
      if (clickY > windowHeight * 0.25 && clickY < windowHeight * 0.75) {
        const isHidden = header.classList.contains('hidden');
        toggleNavbars(isHidden);
      }
    });

    function applyReaderModeUI() {
      if (isSlideMode) {
        scrollArea.classList.add('slide-mode');
        modeIconWebtoon.style.display = 'none';
        modeIconSlide.style.display = 'block';
      } else {
        scrollArea.classList.remove('slide-mode');
        modeIconWebtoon.style.display = 'block';
        modeIconSlide.style.display = 'none';
      }
    }

    modeBtn.addEventListener('click', () => {
      isSlideMode = !isSlideMode;
      localStorage.setItem('mineplay_reader_mode', isSlideMode ? 'slide' : 'webtoon');
      
      applyReaderModeUI();
      
      if (isReaderOpen) {
        const chName = currentChapterKeys[currentChapterIndex];
        const imgList = currentMangaData.chapters[chName] || [];
        renderMangaImages(imgList, currentPage);
      }
    });

    async function loadMangaFromSupabase() {
      const hashId = getMangaHashId();
      
      if (!hashId) {
        navCatalogTitle.textContent = '';
        chapterGrid.innerHTML = getErrorHtml(hashId);
        return;
      }

      const { data, error } = await supabaseClient
        .from('manga_data')
        .select('content');

      if (error || !data || data.length === 0) {
        navCatalogTitle.textContent = '';
        chapterGrid.innerHTML = getErrorHtml(hashId);
        return;
      }

      const match = data.find(item => item.content && String(item.content.anilist_id) === String(hashId));

      if (!match) {
        navCatalogTitle.textContent = '';
        chapterGrid.innerHTML = getErrorHtml(hashId);
        return;
      }

      currentMangaData = match.content;
      const titleName = currentMangaData.title || '';
      navCatalogTitle.textContent = titleName;
      
      renderChapterGrid();

      if (window.location.hash.includes('#baca')) {
        const history = getMangaHistory();
        let targetIndex = 0;
        let targetPage = 1;

        if (history.lastChapter && currentChapterKeys.includes(history.lastChapter)) {
          targetIndex = currentChapterKeys.indexOf(history.lastChapter);
          targetPage = history.lastPage || 1;
        }

        openChapterByIndex(targetIndex, false, targetPage);
      }
    }

    function renderChapterGrid() {
      chapterGrid.innerHTML = '';
      const chapters = currentMangaData.chapters || {};
      let keys = Object.keys(chapters);

      if (keys.length === 0) {
        const hashId = getMangaHashId();
        chapterGrid.innerHTML = getErrorHtml(hashId);
        return;
      }

      keys.sort((a, b) => {
        const numA = parseFloat(a.replace(/[^0-9.]/g, '')) || 0;
        const numB = parseFloat(b.replace(/[^0-9.]/g, '')) || 0;
        return isSortDesc ? numB - numA : numA - numB;
      });

      currentChapterKeys = keys;
      const history = getMangaHistory();

      currentChapterKeys.forEach((chName, index) => {
        const imgList = chapters[chName] || [];
        const isCurrentActive = history.lastChapter === chName;
        const isRead = history.readChapters && history.readChapters.includes(chName);
        
        const card = document.createElement('div');
        let cardClasses = 'chapter-card';
        if (isCurrentActive) cardClasses += ' status-active';
        else if (isRead) cardClasses += ' status-read';
        
        card.className = cardClasses;

        let badgeHtml = '';
        if (isCurrentActive) {
          badgeHtml = `<span class="chapter-status-badge badge-reading">Hal ${history.lastPage || 1}</span>`;
        } else if (isRead) {
          badgeHtml = `<span class="chapter-status-badge badge-read">Dibaca</span>`;
        }

        card.innerHTML = `
          <div class="chapter-info-box">
            <div class="chapter-card-name">${chName}</div>
            <div class="chapter-card-count">${imgList.length} Gambar</div>
          </div>
          ${badgeHtml}
        `;
        applyRippleToElement(card);

        card.addEventListener('click', () => {
          let startPage = 1;
          if (isCurrentActive && history.lastPage) {
            startPage = history.lastPage;
          }
          openChapterByIndex(index, true, startPage);
        });

        chapterGrid.appendChild(card);
      });
    }

    function processImageLoadQueue() {
      if (imageLoadQueue.length === 0) return;
      const item = imageLoadQueue[0];
      
      const timeoutId = setTimeout(() => {
        if (imageLoadQueue[0] === item) {
          if (item.splash && item.splash.parentNode) {
            item.splash.innerHTML = '<span style="color:#fff; font-size:12px;">Gagal memuat</span>';
          }
          imageLoadQueue.shift();
          processImageLoadQueue();
        }
      }, 10000);

      item.img.onload = function() {
        clearTimeout(timeoutId);
        this.classList.add('loaded');
        if (item.splash && item.splash.parentNode) {
          item.splash.remove();
        }
        imageLoadQueue.shift();
        processImageLoadQueue();
      };

      item.img.onerror = function() {
        clearTimeout(timeoutId);
        if (item.splash && item.splash.parentNode) {
          item.splash.innerHTML = '<span style="color:#fff; font-size:12px;">Gagal memuat</span>';
        }
        imageLoadQueue.shift();
        processImageLoadQueue();
      };

      item.img.src = item.url;
    }

    function scrollToPage(pageNumber) {
      setTimeout(() => {
        const wrappers = document.querySelectorAll('.image-wrapper');
        const targetIdx = Math.max(0, Math.min(pageNumber - 1, wrappers.length - 1));
        
        if (wrappers[targetIdx]) {
          if (isSlideMode) {
            scrollArea.scrollTo({ left: targetIdx * scrollArea.clientWidth, top: 0, behavior: 'instant' });
          } else {
            wrappers[targetIdx].scrollIntoView({ behavior: 'instant', block: 'start' });
          }
        }
      }, 50);
    }

    function renderMangaImages(imgList, startPage = 1) {
      const container = document.getElementById('readerContainer');
      container.innerHTML = '';
      imageLoadQueue = [];

      if (imgList.length === 0) {
        const hashId = getMangaHashId();
        container.innerHTML = getErrorHtml(hashId);
        pageIndicator.textContent = `- / -`;
        return;
      }

      totalPages = imgList.length;
      currentPage = Math.min(startPage, totalPages);
      pageIndicator.textContent = `${currentPage} / ${totalPages}`;
      
      const chName = currentChapterKeys[currentChapterIndex];
      saveMangaHistory(chName, currentPage);

      imgList.forEach(url => {
        const wrapper = document.createElement('div');
        wrapper.className = 'image-wrapper';

        const splash = document.createElement('div');
        splash.className = 'loading-splash';
        splash.innerHTML = '<img src="splash.gif" alt="Loading...">';
        wrapper.appendChild(splash);

        const img = document.createElement('img');
        img.className = 'manga-image';

        wrapper.appendChild(img);
        container.appendChild(wrapper);

        imageLoadQueue.push({ img, splash, url });
      });

      processImageLoadQueue();
      scrollToPage(currentPage);
    }

    function openChapterByIndex(index, pushState = true, startPage = 1) {
      if (index < 0 || index >= currentChapterKeys.length) return;
      
      currentChapterIndex = index;
      const chName = currentChapterKeys[index];
      const imgList = currentMangaData.chapters[chName] || [];

      document.getElementById('mangaTitle').textContent = currentMangaData.title || '';
      document.getElementById('mangaChapter').textContent = chName;

      document.getElementById('prevChapterBtn').style.opacity = index === 0 ? '0.4' : '1';
      document.getElementById('nextChapterBtn').style.opacity = index === currentChapterKeys.length - 1 ? '0.4' : '1';

      if (pushState && !isReaderOpen) {
        const baseHash = window.location.hash.replace('#baca', '');
        window.history.pushState({ readerOpen: true }, '', baseHash + '#baca');
      }

      isReaderOpen = true;

      catalogHeader.classList.add('page-behind');
      chapterSelectView.classList.add('page-behind');

      applyReaderModeUI();
      scrollArea.classList.add('active-reader');
      toggleNavbars(true);

      renderMangaImages(imgList, startPage);
    }

    function closeReaderView() {
      if (!isReaderOpen) return;
      isReaderOpen = false;
      imageLoadQueue = [];
      
      scrollArea.classList.remove('active-reader');
      toggleNavbars(false);

      catalogHeader.classList.remove('page-behind');
      chapterSelectView.classList.remove('page-behind');

      renderChapterGrid();
    }

    window.addEventListener('popstate', (e) => {
      if (isReaderOpen && !window.location.hash.includes('#baca')) {
        closeReaderView();
      }
    });

    function init() {
      applyReaderModeUI();
      const rippleTargets = document.querySelectorAll('.catalog-header .back-btn, .catalog-header .sort-btn, .hero-header .back-btn, .mode-btn, .nav-btn');
      rippleTargets.forEach(applyRippleToElement);
      loadMangaFromSupabase();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
