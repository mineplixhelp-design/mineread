<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mineplay - Pengaturan & Karakter</title>
  
  <style>
    @font-face {
      font-family: 'Plus Jakarta Sans';
      src: url('font/jakarta-sans.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --md-sys-color-background: #000000;
      --md-sys-color-surface: #222222;
      --md-sys-color-surface-variant: #2c2c2c;
      --md-sys-color-on-background: #e3e3e3;
      --md-sys-color-on-surface: #ffffff;
      --md-sys-color-on-surface-variant: #8e8e93;

      --danger-color: #e53935;
      --danger-color-active: #c62828;
      --danger-text-color: #ffffff;

      --md-shape-full: 9999px;
      --font-family: 'Plus Jakarta Sans', sans-serif;

      --app-active-transition: all 0.2s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      box-shadow: none !important;
      border: none !important;
      outline: none !important;
    }

    *:focus, *:active, *:focus-visible {
      outline: none !important;
      border: none !important;
      box-shadow: none !important;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      font-family: var(--font-family);
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    button, a, input, select {
      border: none !important;
      outline: none !important;
      background: none;
      font-family: inherit;
    }

    .ripple-effect {
      position: relative;
      overflow: hidden;
    }

    .ripple-wave {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      transform: scale(0);
      animation: smoothRipple 0.4s linear forwards;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes smoothRipple {
      0% { transform: scale(0); opacity: 0.5; }
      100% { transform: scale(2.5); opacity: 0; }
    }

    .navbar {
      height: calc(56px + env(safe-area-inset-top, 24px));
      padding-top: env(safe-area-inset-top, 24px);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 16px;
      padding-right: 16px;
      background-color: var(--md-sys-color-background);
      z-index: 100;
      position: relative;
    }

    .back-btn {
      background: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      transition: var(--app-active-transition);
      flex-shrink: 0;
      z-index: 2;
    }

    .back-btn:active {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .back-btn svg {
      width: 24px;
      height: 24px;
      fill: var(--md-sys-color-on-surface);
    }

    .nav-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--md-sys-color-on-surface);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      flex: 1;
      padding: 0 12px;
    }

    .content-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .scrollable-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      scrollbar-width: none;
      touch-action: pan-y;
      position: relative;
      padding: 0 0 16px 0;
      gap: 16px;
    }

    .scrollable-content::-webkit-scrollbar {
      display: none;
    }

    .settings-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #languageSection {
      margin-top: 12px;
    }

    #characterSection {
      margin-top: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      margin-bottom: 40px;
    }

    .manga-header-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 8px;
    }

    .manga-banner-container {
      width: 100%;
      height: 120px;
      border-radius: 0;
      overflow: hidden;
      position: relative;
      background-color: var(--md-sys-color-surface);
      flex-shrink: 0;
    }

    .manga-banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .manga-banner-img.loaded {
      opacity: 1;
    }

    .manga-cover-overlap {
      width: 110px;
      height: 158px;
      border-radius: 8px;
      overflow: hidden;
      margin-top: -90px;
      z-index: 2;
      background-color: var(--md-sys-color-surface);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      flex-shrink: 0;
    }

    .manga-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .manga-cover-img.loaded {
      opacity: 1;
    }

    .manga-title-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 16px 4px 16px;
      text-align: center;
      gap: 4px;
      width: 100%;
    }

    .manga-title-main {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
    }

    .manga-title-sub {
      font-size: 11px;
      font-weight: 500;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .skeleton {
      position: relative;
      overflow: hidden;
      background-color: #222222 !important;
    }

    .skeleton::after {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      transform: translateX(-100%);
      background-image: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0,
        rgba(255, 255, 255, 0.05) 20%,
        rgba(255, 255, 255, 0.12) 60%,
        rgba(255, 255, 255, 0)
      );
      animation: shimmer 1.5s infinite;
      content: '';
    }

    @keyframes shimmer {
      100% {
        transform: translateX(100%);
      }
    }

    .horizontal-options-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      width: 100%;
      padding: 0 16px;
    }

    .option-bar-item {
      flex: 1 1 calc(50% - 5px);
      min-width: 130px;
      padding: 14px 16px;
      background-color: var(--md-sys-color-surface);
      border-radius: var(--md-shape-full);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: var(--app-active-transition);
    }

    .option-bar-item:active {
      background-color: #333333;
    }

    .option-bar-item.selected {
      background-color: #333333;
    }

    .option-bar-item.disabled {
      opacity: 0.4;
      pointer-events: none;
      cursor: not-allowed;
    }

    .option-circle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      box-sizing: border-box;
      border: 1.5px solid #666666 !important;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
      background-color: transparent;
    }

    .option-bar-item.selected .option-circle {
      border-color: #ffffff !important;
      background-color: #ffffff;
    }

    .option-circle::after {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #000000;
      transform: scale(0);
      transition: transform 0.15s ease;
    }

    .option-bar-item.selected .option-circle::after {
      transform: scale(1);
    }

    .option-bar-label {
      font-size: 13px;
      font-weight: 600;
      color: #cccccc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .option-bar-item.selected .option-bar-label {
      color: #ffffff;
      font-weight: 700;
    }

    .option-bar-item.danger-item {
      flex: 1 1 100%;
      justify-content: center;
      background-color: var(--danger-color);
      border-radius: var(--md-shape-full);
    }

    .option-bar-item.danger-item .option-bar-label {
      color: var(--danger-text-color);
      font-weight: 700;
    }

    .option-bar-item.danger-item:active {
      background-color: var(--danger-color-active);
    }

    .char-profile-container {
      display: flex;
      gap: 16px;
      padding: 0 16px;
      align-items: flex-start;
    }

    .char-cover-wrapper {
      width: 110px;
      height: 155px;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
      background-color: var(--md-sys-color-surface);
      position: relative;
    }

    .char-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .char-cover-img.loaded {
      opacity: 1;
    }

    .char-details-header {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      justify-content: center;
      min-height: 155px;
    }

    .char-name-primary {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.25;
    }

    .char-name-native {
      font-size: 13px;
      font-weight: 500;
      color: #8e8e93;
    }

    .char-badge-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .char-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
      background-color: var(--md-sys-color-surface);
      color: #cccccc;
      display: inline-flex;
      align-items: center;
    }

    .char-info-card {
      margin: 0 16px;
      padding: 16px;
      background-color: var(--md-sys-color-surface);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .char-card-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .char-description-text {
      font-size: 13px;
      line-height: 1.6;
      color: #b0b0b0;
      white-space: pre-line;
      flex: 1;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .char-description-text::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body>

  <header class="navbar">
    <button class="back-btn ripple-effect" id="backBtn" title="Kembali">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <div class="nav-title" id="navTitle">Pengaturan</div>
    <div style="width: 36px;"></div>
  </header>

  <div class="content-wrapper">
    <div class="scrollable-content" id="scrollableContent">
      
      <div class="settings-section" id="mangaSyncSection" style="display: none;">
        <div class="manga-header-wrapper">
          <div class="manga-banner-container skeleton" id="bannerContainer">
            <img class="manga-banner-img" id="syncMangaBanner" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 50'%3E%3C/svg%3E" alt="Banner">
          </div>
          <div class="manga-cover-overlap skeleton" id="coverContainer">
            <img class="manga-cover-img" id="syncMangaCover" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 150'%3E%3C/svg%3E" alt="Cover">
          </div>
          <div class="manga-title-block">
            <div class="manga-title-main" id="mangaTitleMain">-</div>
            <div class="manga-title-sub" id="mangaTitleSub">-</div>
          </div>
        </div>
        
        <div class="horizontal-options-grid" id="mangaOptionsGrid">
          <div class="option-bar-item ripple-effect" onclick="selectMangaStatus('CURRENT')">

          <div class="option-bar-item ripple-effect" onclick="selectMangaStatus('COMPLETED')">
            <div class="option-circle" data-manga-status="COMPLETED"></div>
            <span class="option-bar-label">Completed</span>
          </div>
          <div class="option-bar-item ripple-effect" onclick="selectMangaStatus('PAUSED')">

            <span class="option-bar-label">Paused</span>
          </div>
          <div class="option-bar-item ripple-effect" onclick="selectMangaStatus('DROPPED')">

      <div class="settings-section" id="languageSection" style="display: none;">

          <div class="option-bar-item ripple-effect" onclick="selectTranslateLanguage('en', 'English')">
            <div class="option-circle" data-lang-radio="en"></div>
            <span class="option-bar-label">English</span>
          </div>
          <div class="option-bar-item ripple-effect" onclick="selectTranslateLanguage('id', 'Bahasa Indonesia')">
            <div class="option-circle" data-lang-radio="id"></div>
            <span class="option-bar-label">Indonesia</span>
          </div>
          <div class="option-bar-item ripple-effect" onclick="selectTranslateLanguage('ja', '日本語')">
            <div class="option-circle" data-lang-radio="ja"></div>
            <span class="option-bar-label">日本語</span>

        </div>
      </div>

      <div class="settings-section" id="characterSection" style="display: none;">
        <div class="char-profile-container">
          <div class="char-cover-wrapper skeleton" id="charCoverContainer">
            <img class="char-cover-img" id="charCoverImg" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 150'%3E%3C/svg%3E" alt="Character Cover">
          </div>
          <div class="char-details-header">
            <div class="char-name-primary" id="charNamePrimary">-</div>
            <div class="char-name-native" id="charNameNative">-</div>
            <div class="char-badge-group" id="charBadges">
              <span class="char-badge" id="charAgeBadge" style="display:none;">-</span>
              <span class="char-badge" id="charGenderBadge" style="display:none;">-</span>
              <span class="char-badge" id="charDobBadge" style="display:none;">-</span>
              <span class="char-badge" id="charRoleBadge" style="display:none;">-</span>

        <div class="char-info-card">

    </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, remove, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCUIU56gmsBa--tSQCS3qvXV6-cAC537rA",
      authDomain: "mineread-2d3b4.firebaseapp.com",
      databaseURL: "https://mineread-2d3b4-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "mineread-2d3b4",
      storageBucket: "mineread-2d3b4.firebasestorage.app",
      messagingSenderId: "327279446968",
      appId: "1:327279446968:web:fef4fca38241e7c3899d4d",
      measurementId: "G-WZEJ797GRS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const ANILIST_API_URL = 'https://graphql.anilist.co';
    const TRANSLATE_STORAGE_KEY = 'mineplay_lang_pref';

    let currentFetchedTitle = '';

    function createRipple(event) {
      const button = event.currentTarget;
      const circle = document.createElement("span");
      const diameter = Math.max(button.clientWidth, button.clientHeight);
      const radius = diameter / 2;

      const rect = button.getBoundingClientRect();
      circle.style.width = circle.style.height = `${diameter}px`;
      circle.style.left = `${event.clientX - rect.left - radius}px`;
      circle.style.top = `${event.clientY - rect.top - radius}px`;
      circle.classList.add("ripple-wave");

      const ripple = button.getElementsByClassName("ripple-wave")[0];
      if (ripple) {
        ripple.remove();
      }
      button.appendChild(circle);
    }

    function initRipples() {
      document.querySelectorAll('.ripple-effect').forEach(btn => {
        btn.removeEventListener('pointerdown', createRipple);
        btn.addEventListener('pointerdown', createRipple);
      });
    }

    function sanitizeKey(key) {
      if (!key) return '';
      return String(key).replace(/[.#$[\]]/g, "_");
    }

    function executeGoBack() {
      if (window.Android && typeof window.Android.goBack === 'function') {
        window.Android.goBack();
      } else if (window.android && typeof window.android.goBack === 'function') {
        window.android.goBack();
      } else {
        window.history.back();
      }
    }

    // Deteksi User UUID dari latar belakang (Login/Storage)
    function getLoggedInUserUuid() {
      let uuid = localStorage.getItem('account:uuid') || 
                 localStorage.getItem('account:uid') || 
                 localStorage.getItem('user_id') || 
                 localStorage.getItem('uuid');

      // Fallback: Apabila user login via username/email lama, periksa uuid cadangan
      if (!uuid) {
        const username = localStorage.getItem('account:username') || localStorage.getItem('account:email');
        if (username) {
          uuid = 'usr_' + sanitizeKey(username);
        }
      }

      // Generasi ID Unik Anonim Sementara jika tidak ada sesi login latar belakang
      if (!uuid) {
        uuid = localStorage.getItem('mineplay_anon_uuid');
        if (!uuid) {
          uuid = 'anon_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
          localStorage.setItem('mineplay_anon_uuid', uuid);
        }
      }

      return sanitizeKey(uuid);
    }

    function getUserStatusData(userUuid) {
      try {
        return JSON.parse(localStorage.getItem('mineplay_manga_status_' + userUuid) || '{}');
      } catch (e) {
        return {};
      }
    }

    function saveUserStatusData(userUuid, data) {
      localStorage.setItem('mineplay_manga_status_' + userUuid, JSON.stringify(data));
      let bookmarksList = [];
      Object.keys(data).forEach(id => {
        if (data[id] && data[id].status && data[id].status !== 'REMOVE') {
          bookmarksList.push(data[id]);
        }
      });
      localStorage.setItem('mineplay_manga_bookmarks', JSON.stringify(bookmarksList));
    }

    function getSavedLanguage() {
      return localStorage.getItem(TRANSLATE_STORAGE_KEY) || 'en';
    }

    function saveLanguagePreference(langCode) {
      localStorage.setItem(TRANSLATE_STORAGE_KEY, langCode);
    }

    function parseHashParams() {
      const hash = window.location.hash.substring(1);
      const params = {};
      if (!hash) return params;

      if (hash.startsWith('opsisave=')) {
        params.opsisave = hash.replace('opsisave=', '');
      } else if (hash.startsWith('char=')) {
        params.char = hash.replace('char=', '');
      } else if (hash === 'bahasa') {
        params.bahasa = true;
      }
      return params;
    }

    function getMangaIdFromHash() {
      const params = parseHashParams();
      const rawId = params.opsisave;
      const parsedId = parseInt(rawId, 10);
      return isNaN(parsedId) ? null : parsedId;
    }

    function getCharIdFromHash() {
      const params = parseHashParams();
      const rawId = params.char;
      const parsedId = parseInt(rawId, 10);
      return isNaN(parsedId) ? null : parsedId;
    }

    function setOptionsDisabled(disabled) {
      const grid = document.getElementById('mangaOptionsGrid');
      if (!grid) return;
      const items = grid.querySelectorAll('.option-bar-item');
      items.forEach(item => {
        if (disabled) {
          item.classList.add('disabled');
        } else {
          item.classList.remove('disabled');
        }
      });
    }

    const ANILIST_QUERY = `
      query ($id: Int) {
        Media(id: $id, type: MANGA) {
          id
          bannerImage
          coverImage {
            extraLarge
            large
          }
          title {
            english
            romaji
            native
          }
        }
      }
    `;

    const ANILIST_CHAR_QUERY = `
      query ($id: Int) {
        Character(id: $id) {
          id
          name {
            full
            native
            userPreferred
          }
          image {
            large
            medium
          }
          description(asHtml: false)
          gender
          age
          dateOfBirth {
            year
            month
            day
          }
          favourites
          media(page: 1, perPage: 1) {
            edges {
              characterRole
            }
          }
        }
      }
    `;

    async function fetchMangaQuickDetail(mangaId) {
      try {
        const res = await fetch(ANILIST_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json',
          },
          body: JSON.stringify({
            query: ANILIST_QUERY,
            variables: { id: mangaId }
          })
        });
        const json = await res.json();
        return json?.data?.Media || null;
      } catch (e) {
        return null;
      }
    }

    async function fetchCharacterDetail(charId) {
      try {
        const res = await fetch(ANILIST_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json',
          },
          body: JSON.stringify({
            query: ANILIST_CHAR_QUERY,
            variables: { id: charId }
          })
        });
        const json = await res.json();
        return json?.data?.Character || null;
      } catch (e) {
        return null;
      }
    }

    function updateFavUI(activeStatus) {
      document.querySelectorAll('.option-circle[data-manga-status]').forEach(circle => {
        const status = circle.getAttribute('data-manga-status');
        const item = circle.closest('.option-bar-item');
        if (status === activeStatus) {
          item.classList.add('selected');
        } else {
          item.classList.remove('selected');
        }
      });
    }

    async function selectMangaStatus(statusValue) {
      const userUuid = getLoggedInUserUuid();
      if (!userUuid) return;

      const mangaId = getMangaIdFromHash();
      if (!mangaId) return;

      const saveRef = ref(db, `save_manga/${userUuid}/${mangaId}`);
      const userStatusData = getUserStatusData(userUuid);

      if (statusValue === 'REMOVE') {
        delete userStatusData[mangaId];
        updateFavUI(null);
        try {
          await remove(saveRef);
        } catch (err) {
          console.error(err);
        }
      } else {
        const coverElem = document.getElementById('syncMangaCover');

        const dbDataObj = {
          id: mangaId,
          status: statusValue,
          updatedAt: Date.now()
        };

        userStatusData[mangaId] = {
          ...dbDataObj,
          title: currentFetchedTitle || '',
          poster: coverElem ? coverElem.src : ''
        };

        updateFavUI(statusValue);
        try {
          await set(saveRef, dbDataObj);
        } catch (err) {
          console.error(err);
        }
      }

      saveUserStatusData(userUuid, userStatusData);
    }

    function selectTranslateLanguage(langCode) {
      saveLanguagePreference(langCode);
      updateLangUI(langCode);
    }

    function updateLangUI(savedLang) {
      document.querySelectorAll('.option-circle[data-lang-radio]').forEach(circle => {
        const lang = circle.getAttribute('data-lang-radio');
        const item = circle.closest('.option-bar-item');
        if (lang === savedLang) {
          item.classList.add('selected');
        } else {
          item.classList.remove('selected');
        }
      });
    }

    async function loadMangaSyncSection() {
      const mangaId = getMangaIdFromHash();
      const section = document.getElementById('mangaSyncSection');
      const bannerContainer = document.getElementById('bannerContainer');
      const bannerElem = document.getElementById('syncMangaBanner');
      const coverContainer = document.getElementById('coverContainer');
      const coverElem = document.getElementById('syncMangaCover');
      const titleMain = document.getElementById('mangaTitleMain');
      const titleSub = document.getElementById('mangaTitleSub');

      if (!mangaId) {
        if (section) section.style.display = 'flex';
        if (bannerContainer) bannerContainer.classList.remove('skeleton');
        if (coverContainer) coverContainer.classList.remove('skeleton');
        setOptionsDisabled(true);
        return;
      }

      if (section) section.style.display = 'flex';
      setOptionsDisabled(false);

      if (bannerContainer) bannerContainer.classList.add('skeleton');
      if (coverContainer) coverContainer.classList.add('skeleton');
      if (bannerElem) bannerElem.classList.remove('loaded');
      if (coverElem) coverElem.classList.remove('loaded');
      titleMain.innerText = 'Memuat...';
      titleSub.innerText = '';

      updateFavUI(null);

      const userUuid = getLoggedInUserUuid();
      if (userUuid) {
        const userStatusData = getUserStatusData(userUuid);
        if (userStatusData[mangaId] && userStatusData[mangaId].status) {
          updateFavUI(userStatusData[mangaId].status);
        }

        const saveRef = ref(db, `save_manga/${userUuid}/${mangaId}`);
        get(saveRef).then((snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.val();
            if (data && data.status) {
              updateFavUI(data.status);
              userStatusData[mangaId] = {
                ...userStatusData[mangaId],
                ...data
              };
              saveUserStatusData(userUuid, userStatusData);
            }
          } else {
            if (userStatusData[mangaId]) {
              delete userStatusData[mangaId];
              saveUserStatusData(userUuid, userStatusData);
            }
            updateFavUI(null);
          }
        }).catch((err) => {
          console.error(err);
        });
      }

      const mangaData = await fetchMangaQuickDetail(mangaId);
      if (mangaData) {
        currentFetchedTitle = mangaData.title.english || mangaData.title.romaji || mangaData.title.native || '';
        
        titleMain.innerText = mangaData.title.english || mangaData.title.romaji || '';
        titleSub.innerText = mangaData.title.native || mangaData.title.romaji || '';

        const bannerSrc = mangaData.bannerImage || mangaData.coverImage?.extraLarge || mangaData.coverImage?.large || '';
        const coverSrc = mangaData.coverImage?.extraLarge || mangaData.coverImage?.large || '';

        if (bannerElem && bannerSrc) {
          const bannerLoader = new Image();
          bannerLoader.src = bannerSrc;
          bannerLoader.onload = () => {
            bannerElem.src = bannerSrc;
            if (bannerContainer) bannerContainer.classList.remove('skeleton');
            bannerElem.classList.add('loaded');
          };
          bannerLoader.onerror = () => {
            if (bannerContainer) bannerContainer.classList.remove('skeleton');
          };
        } else if (bannerContainer) {
          bannerContainer.classList.remove('skeleton');
        }

        if (coverElem && coverSrc) {
          const coverLoader = new Image();
          coverLoader.src = coverSrc;
          coverLoader.onload = () => {
            coverElem.src = coverSrc;
            if (coverContainer) coverContainer.classList.remove('skeleton');
            coverElem.classList.add('loaded');
          };
          coverLoader.onerror = () => {
            if (coverContainer) coverContainer.classList.remove('skeleton');
          };
        } else if (coverContainer) {
          coverContainer.classList.remove('skeleton');
        }

        if (userUuid) {
          const userStatusData = getUserStatusData(userUuid);
          if (userStatusData[mangaId]) {
            userStatusData[mangaId].title = currentFetchedTitle;
            userStatusData[mangaId].poster = coverSrc || bannerSrc;
            saveUserStatusData(userUuid, userStatusData);
          }
        }
      } else {
        if (bannerContainer) bannerContainer.classList.remove('skeleton');
        if (coverContainer) coverContainer.classList.remove('skeleton');
        titleMain.innerText = 'Manga tidak ditemukan';
        titleSub.innerText = '';
        setOptionsDisabled(true);
      }
    }

    async function loadCharacterSection() {
      const charId = getCharIdFromHash();
      const section = document.getElementById('characterSection');
      const coverContainer = document.getElementById('charCoverContainer');
      const coverImg = document.getElementById('charCoverImg');
      const namePrimary = document.getElementById('charNamePrimary');
      const nameNative = document.getElementById('charNameNative');
      const ageBadge = document.getElementById('charAgeBadge');
      const genderBadge = document.getElementById('charGenderBadge');
      const dobBadge = document.getElementById('charDobBadge');
      const roleBadge = document.getElementById('charRoleBadge');
      const favsBadge = document.getElementById('charFavsBadge');
      const descElem = document.getElementById('charDescription');

      if (!charId) {
        if (section) section.style.display = 'flex';
        return;
      }

      if (section) section.style.display = 'flex';
      if (coverContainer) coverContainer.classList.add('skeleton');
      if (coverImg) coverImg.classList.remove('loaded');
      
      namePrimary.innerText = 'Memuat...';
      nameNative.innerText = '';
      ageBadge.style.display = 'none';
      genderBadge.style.display = 'none';
      dobBadge.style.display = 'none';
      roleBadge.style.display = 'none';
      favsBadge.style.display = 'none';
      descElem.innerText = 'Memuat deskripsi...';

      const charData = await fetchCharacterDetail(charId);

      if (charData) {
        namePrimary.innerText = charData.name?.userPreferred || charData.name?.full || 'Unknown';
        nameNative.innerText = charData.name?.native || '';

        if (charData.age) {
          ageBadge.innerText = `Umur: ${charData.age}`;
          ageBadge.style.display = 'inline-flex';
        }

        if (charData.gender) {
          genderBadge.innerText = charData.gender;
          genderBadge.style.display = 'inline-flex';
        }

        if (charData.dateOfBirth && (charData.dateOfBirth.month || charData.dateOfBirth.day)) {
          const dobText = [charData.dateOfBirth.day, charData.dateOfBirth.month, charData.dateOfBirth.year].filter(Boolean).join('/');
          dobBadge.innerText = `Lahir: ${dobText}`;
          dobBadge.style.display = 'inline-flex';
        }

        if (charData.media?.edges?.[0]?.characterRole) {
          roleBadge.innerText = `Role: ${charData.media.edges[0].characterRole}`;
          roleBadge.style.display = 'inline-flex';
        }

        if (typeof charData.favourites === 'number') {
          favsBadge.innerText = `Like ${charData.favourites.toLocaleString()}`;
          favsBadge.style.display = 'inline-flex';
        }

        const cleanDesc = charData.description ? charData.description.replace(/~!|!~/g, '').replace(/<br\s*\/?>/gi, '\n') : 'Tidak ada deskripsi tersedia.';
        descElem.innerText = cleanDesc;

        const imgSrc = charData.image?.large || charData.image?.medium || '';
        if (coverImg && imgSrc) {
          const imgLoader = new Image();
          imgLoader.src = imgSrc;
          imgLoader.onload = () => {
            coverImg.src = imgSrc;
            if (coverContainer) coverContainer.classList.remove('skeleton');
            coverImg.classList.add('loaded');
          };
          imgLoader.onerror = () => {
            if (coverContainer) coverContainer.classList.remove('skeleton');
          };
        } else if (coverContainer) {
          coverContainer.classList.remove('skeleton');
        }
      } else {
        if (coverContainer) coverContainer.classList.remove('skeleton');
        namePrimary.innerText = 'Karakter tidak ditemukan';
        descElem.innerText = '-';
      }
    }

    function handleRouteView() {
      const hashParams = parseHashParams();
      const mangaSection = document.getElementById('mangaSyncSection');
      const langSection = document.getElementById('languageSection');
      const charSection = document.getElementById('characterSection');
      const navTitle = document.getElementById('navTitle');

      mangaSection.style.display = 'none';
      langSection.style.display = 'none';
      charSection.style.display = 'none';

      if (hashParams.opsisave) {
        navTitle.innerText = 'Status Bookmark';
        mangaSection.style.display = 'flex';
        loadMangaSyncSection();
      } else if (hashParams.char) {
        navTitle.innerText = 'Detail Karakter';
        charSection.style.display = 'flex';
        loadCharacterSection();
      } else if (hashParams.bahasa) {
        navTitle.innerText = 'Bahasa Terjemahan';
        langSection.style.display = 'flex';
        updateLangUI(getSavedLanguage());
      } else {
        navTitle.innerText = 'Pengaturan';
        langSection.style.display = 'flex';
        updateLangUI(getSavedLanguage());
      }
    }

    window.selectMangaStatus = selectMangaStatus;
    window.selectTranslateLanguage = selectTranslateLanguage;
    window.executeGoBack = executeGoBack;

    window.addEventListener('hashchange', () => {
      handleRouteView();
    });

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('backBtn').addEventListener('click', executeGoBack);
      handleRouteView();
      initRipples();
    });
  </script>
</body>
</html>
