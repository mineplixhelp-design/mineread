<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mineplay - Pilih Paket Premium</title>
  
  <style>
    @font-face {
      font-family: 'Plus Jakarta Sans';
      src: url('font/jakarta-sans.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    
    :root {
      --md-sys-color-background: #000000;
      --md-sys-color-surface: #121212;
      --md-sys-color-surface-variant: #1e1e1e;
      
      --md-sys-color-primary: #FFD700;
      --md-sys-color-on-primary: #000000;
      --md-sys-color-on-background: #e3e3e3;
      --md-sys-color-on-surface: #e3e3e3;
      --md-sys-color-on-surface-variant: #a0a0a0;

      --md-shape-full: 9999px;
      --font-family: 'Plus Jakarta Sans', sans-serif;

      --app-active-transition: background-color 0.2s ease, opacity 0.15s ease, transform 0.15s ease, border-color 0.2s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      box-shadow: none !important;
      border: none !important;
      outline: none !important;
    }

    *:focus, *:active, *:focus-visible {
      outline: none !important;
      border: none !important;
      box-shadow: none !important;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      font-family: var(--font-family);
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    button, a, input {
      border: none !important;
      outline: none !important;
      background: none;
      font-family: inherit;
    }

    .ripple-effect {
      position: relative;
      overflow: hidden;
    }

    .ripple-wave {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.20);
      transform: scale(0);
      animation: smoothRipple 0.4s linear forwards;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes smoothRipple {
      0% { transform: scale(0); opacity: 0.6; }
      100% { transform: scale(2.5); opacity: 0; }
    }

    .navbar {
      height: calc(56px + env(safe-area-inset-top, 24px));
      padding-top: env(safe-area-inset-top, 24px);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 16px;
      padding-right: 16px;
      background-color: var(--md-sys-color-background);
      z-index: 100;
      position: relative;
    }

    .nav-btn {
      background: none;
      border: none !important;
      outline: none !important;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      transition: var(--app-active-transition);
      flex-shrink: 0;
      z-index: 2;
    }

    .nav-btn:active {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .nav-btn svg {
      width: 24px;
      height: 24px;
      fill: var(--md-sys-color-on-surface);
    }

    .nav-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--md-sys-color-on-surface);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      flex: 1;
      padding: 0 12px;
    }

    .nav-placeholder {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }

    .content-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 100px;
      scrollbar-width: none;
    }

    .content-wrapper::-webkit-scrollbar {
      display: none;
    }

    .benefit-gif-card {
      width: 100%;
      overflow: hidden;
      background-color: var(--md-sys-color-surface);
      margin-bottom: 16px;
      border-radius: 12px;
    }

    .benefit-gif {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .plans-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 12px;
    }

    .plan-card {
      background-color: var(--md-sys-color-surface);
      border: 2px solid transparent !important;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      position: relative;
      transition: var(--app-active-transition);
    }

    .plan-card.selected {
      border-color: var(--md-sys-color-primary) !important;
      background-color: #1a1708;
    }

    .plan-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .radio-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--md-sys-color-on-surface-variant) !important;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--app-active-transition);
    }

    .plan-card.selected .radio-circle {
      border-color: var(--md-sys-color-primary) !important;
    }

    .radio-inner {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--md-sys-color-primary);
      opacity: 0;
      transform: scale(0);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .plan-card.selected .radio-inner {
      opacity: 1;
      transform: scale(1);
    }

    .plan-details {
      display: flex;
      flex-direction: column;
    }

    .plan-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--md-sys-color-on-surface);
      margin-bottom: 2px;
    }

    .plan-subtext {
      font-size: 11px;
      color: var(--md-sys-color-on-surface-variant);
    }

    .plan-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .plan-price {
      font-size: 15px;
      font-weight: 800;
      color: var(--md-sys-color-primary);
    }

    .plan-period {
      font-size: 10px;
      color: var(--md-sys-color-on-surface-variant);
    }

    .bottom-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 150;
      display: flex;
      align-items: center;
      width: calc(100% - 32px);
      max-width: 380px;
    }

    .buy-btn {
      width: 100%;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #FFD700 0%, #FF8C00 100%);
      border-radius: var(--md-shape-full);
      cursor: pointer;
      color: #000000;
      font-size: 15px;
      font-weight: 800;
      transition: var(--app-active-transition);
    }

    .buy-btn:active {
      opacity: 0.9;
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <header class="navbar">
    <button class="nav-btn ripple-effect" id="backBtn" onclick="executeGoBack()" title="Kembali">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <div class="nav-title">Mineplay Premium</div>
    <div class="nav-placeholder"></div>
  </header>

  <div class="content-wrapper">
    <div class="benefit-gif-card">
      <img src="ben.gif" alt="Benefit Banner" class="benefit-gif">
    </div>

    <div class="plans-container">
      <div class="plan-card ripple-effect" onclick="selectPlan(this, 'monthly')">
        <div class="plan-left">
          <div class="radio-circle">
            <div class="radio-inner"></div>
          </div>
          <div class="plan-details">
            <span class="plan-name">Mingguan</span>
            <span class="plan-subtext">Akses penuh selama 7 hari</span>
          </div>
        </div>
        <div class="plan-right">
          <span class="plan-price">Rp 10.000</span>
          <span class="plan-period">/ minggu</span>
        </div>
      </div>

      <div class="plan-card selected ripple-effect" onclick="selectPlan(this, 'yearly')">
        <div class="plan-left">
          <div class="radio-circle">
            <div class="radio-inner"></div>
          </div>
          <div class="plan-details">
            <span class="plan-name">Bulanan</span>
            <span class="plan-subtext">Akses penuh selama 30 hari</span>
          </div>
        </div>
        <div class="plan-right">
          <span class="plan-price">Rp 16.000</span>
          <span class="plan-period">/ bulan</span>
        </div>
      </div>

      <div class="plan-card ripple-effect" onclick="selectPlan(this, 'lifetime')">
        <div class="plan-left">
          <div class="radio-circle">
            <div class="radio-inner"></div>
          </div>
          <div class="plan-details">
            <span class="plan-name">Tahun</span>
            <span class="plan-subtext">Akses 1 tahun penuh</span>
          </div>
        </div>
        <div class="plan-right">
          <span class="plan-price">Rp 50.000</span>
          <span class="plan-period">sekali bayar</span>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <button class="buy-btn ripple-effect" id="buyBtn" onclick="processPurchase()">
      Beli Sekarang
    </button>
  </div>

  <script>
    let selectedPlanType = 'yearly';

    function createRipple(event) {
      const button = event.currentTarget;
      const circle = document.createElement("span");
      const diameter = Math.max(button.clientWidth, button.clientHeight);
      const radius = diameter / 2;

      const rect = button.getBoundingClientRect();
      circle.style.width = circle.style.height = `${diameter}px`;
      circle.style.left = `${event.clientX - rect.left - radius}px`;
      circle.style.top = `${event.clientY - rect.top - radius}px`;
      circle.classList.add("ripple-wave");

      const ripple = button.getElementsByClassName("ripple-wave")[0];
      if (ripple) {
        ripple.remove();
      }
      button.appendChild(circle);
    }

    function initRipples() {
      document.querySelectorAll('.ripple-effect').forEach(btn => {
        btn.removeEventListener('pointerdown', createRipple);
        btn.addEventListener('pointerdown', createRipple);
      });
    }

    function selectPlan(cardElement, planType) {
      document.querySelectorAll('.plan-card').forEach(card => {
        card.classList.remove('selected');
      });
      cardElement.classList.add('selected');
      selectedPlanType = planType;
    }

    function executeGoBack() {
      if (window.Android && typeof window.Android.goBack === 'function') {
        window.Android.goBack();
      } else if (window.android && typeof window.android.goBack === 'function') {
        window.android.goBack();
      } else {
        window.history.back();
      }
    }

    function processPurchase() {
      if (window.Android && typeof window.Android.openPayment === 'function') {
        window.Android.openPayment(selectedPlanType);
      } else if (window.android && typeof window.android.openPayment === 'function') {
        window.android.openPayment(selectedPlanType);
      } else {
        alert('Memproses pembelian paket: ' + selectedPlanType);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initRipples();
    });
  </script>
</body>
</html>
