<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  
  <!-- Swiper.js CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <style>
    @font-face {
      font-family: 'Plus Jakarta Sans';
      src: url('font/jakarta-sans.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-color: #000000;
      --surface-color: #1a1a1a;
      --surface-variant-color: #222222;
      --primary-color: #90caf9;
      --text-color: #ffffff;
      --text-muted-color: #a0a0a0;
      --font-main: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    button {
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      -webkit-appearance: none;
      appearance: none;
    }

    .app-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 36px 20px 16px;
      background: linear-gradient(180deg, rgba(13,13,13,0.8) 0%, rgba(13,13,13,0) 100%);
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
      z-index: 100;
      transition: background-color 0.3s ease, backdrop-filter 0.3s ease;
    }

    .app-header.header-scrolled {
      background-color: rgba(13, 13, 13, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .app-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.6px;
      color: var(--text-color);
    }

    .header-action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      color: var(--text-color);
      background: transparent;
      transition: opacity 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .header-action-btn:active {
      opacity: 0.7;
    }

    .header-action-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .tab-bar {
      display: flex;
      gap: 8px;
      padding: 10px 20px 0;
      margin-bottom: 10px;
      background-color: var(--bg-color);
      flex-shrink: 0;
      position: relative;
      z-index: 99;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tab-bar::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      flex: 1;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-muted-color);
      padding: 10px;
      background: transparent;
      white-space: nowrap;
      cursor: pointer;
      position: relative;
      transition: color 0.3s ease, border-color 0.3s ease;
      border-bottom: 2px solid transparent;
      overflow: hidden;
    }

    .tab-btn.active {
      color: #ffffff;
      border-bottom: 2px solid #ffffff;
    }

    .content-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: 86px;
    }

    /* Swiper Container Layout */
    .swiper {
      width: 100%;
      height: 100%;
    }

    .swiper-slide {
      height: 100%;
      overflow-y: auto;
      padding: 16px 20px 40px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      box-sizing: border-box;
    }

    .swiper-slide::-webkit-scrollbar {
      display: none;
    }

    #tab-bookmark {
      padding: 0;
    }

    .profile-card {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      border: none;
      background-color: var(--surface-color);
    }

    .user-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 2;
    }

    .user-name {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-color);
      word-break: break-all;
    }

    .user-email {
      font-size: 13px;
      color: var(--text-muted-color);
      word-break: break-all;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-muted-color);
      margin: 20px 6px 14px 6px;
    }

    .menu-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: transparent;
      margin-bottom: 24px;
      position: relative;
    }

    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      background: var(--surface-color);
      border-radius: 9999px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      border: none;
      transition: background-color 0.2s ease;
    }

    .menu-item:active {
      background: rgba(255, 255, 255, 0.08);
    }

    .menu-item-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      background: transparent;
      color: #ffffff;
      flex-shrink: 0;
    }

    .menu-item-icon {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    .menu-item-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-color);
      letter-spacing: -0.2px;
    }

    .menu-item-arrow {
      width: 18px;
      height: 18px;
      fill: var(--text-muted-color);
      flex-shrink: 0;
      opacity: 0.7;
    }

    .action-btn-wrapper {
      margin-top: 10px;
    }

    .btn-action {
      width: 100%;
      padding: 20px;
      background: var(--surface-color);
      border: none;
      color: var(--text-color);
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: 9999px;
      position: relative;
      overflow: hidden;
      transition: background-color 0.2s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    }

    .btn-action:active {
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-action svg {
      width: 18px;
      height: 18px;
      fill: var(--text-color);
    }

    .bookmark-list {
      display: flex;
      flex-direction: column;
      padding: 10px 20px 40px;
    }

    .content-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 8px;
      padding: 12px 16px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, background-color 0.2s ease;
      width: 100%;
      box-sizing: border-box;
    }

    .content-card-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .cover-container {
      width: 52px;
      height: 70px;
      border-radius: 6px;
      background-color: var(--surface-variant-color);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .cover-img.loaded {
      opacity: 1;
    }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-subtext {
      font-size: 12px;
      color: var(--text-muted-color);
      letter-spacing: 0.5px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      margin-left: 12px;
      flex-shrink: 0;
    }

    .status-badge svg {
      width: 18px;
      height: 18px;
      fill: var(--text-muted-color);
    }

    .skeleton {
      position: relative;
      overflow: hidden;
      background-color: #222222 !important;
    }

    .skeleton::after {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      transform: translateX(-100%);
      background-image: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0,
        rgba(255, 255, 255, 0.05) 20%,
        rgba(255, 255, 255, 0.12) 60%,
        rgba(255, 255, 255, 0)
      );
      animation: shimmer 1.5s infinite;
      content: '';
    }

    @keyframes shimmer {
      100% { transform: translateX(100%); }
    }

    .ripple-circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transform: scale(0);
      animation: smoothRipple 0.6s ease-out forwards;
      pointer-events: none;
      z-index: 3;
    }

    @keyframes smoothRipple {
      to {
        transform: scale(3);
        opacity: 0;
      }
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted-color);
      font-size: 14px;
      gap: 6px;
    }

    .empty-state-title {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
    }

    .empty-state-sub {
      font-size: 12px;
      color: var(--text-muted-color);
    }
  </style>
</head>
<body>

  <header class="app-header" id="appHeader">
    <div class="app-title">Profile</div>
    <button class="header-action-btn" id="crownBtn" onclick="navigateTo('https://mineread.vercel.app/apps/bridge/prem.html')" aria-label="Premium">
      <svg viewBox="0 0 24 24"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>

    <!-- Swiper Container -->

          <div class="section-title">Informasi & Bantuan</div>
          <div class="menu-group">

            <div class="menu-item" onclick="navigateTo('update.html')">
              <div class="menu-item-left">
                <div class="icon-badge">
                  <svg class="menu-item-icon" viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
                </div>

                  <svg class="menu-item-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>

            <div class="menu-item" onclick="navigateTo('info.html#privacy')">
              <div class="menu-item-left">
                <div class="icon-badge">
                  <svg class="menu-item-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>

  <!-- Swiper.js Script -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { 
      getAuth, 
      setPersistence, 
      indexedDBLocalPersistence, 
      browserLocalPersistence, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCUIU56gmsBa--tSQCS3qvXV6-cAC537rA",
      authDomain: "mineread-2d3b4.firebaseapp.com",
      databaseURL: "https://mineread-2d3b4-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "mineread-2d3b4",
      storageBucket: "mineread-2d3b4.firebasestorage.app",
      messagingSenderId: "327279446968",
      appId: "1:327279446968:web:fef4fca38241e7c3899d4d",
      measurementId: "G-WZEJ797GRS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    setPersistence(auth, indexedDBLocalPersistence).catch(() => {
      setPersistence(auth, browserLocalPersistence);
    });

    const ANILIST_API_URL = 'https://graphql.anilist.co';
    let isLoggedIn = false;
    let currentUser = null;
    let unsubscribeBookmark = null;

    let allBookmarks = [];

    const STATUS_ICONS = {
      COMPLETED: `<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`,
      READING: `<svg viewBox="0 0 24 24"><path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.13-1.3 4.85-1.42.59-.04 1.15-.14 1.65-.25.3-.07.5-.33.5-.63V5zm-2 12.8c-.85.12-1.78.2-2.7.2-1.7 0-3.35-.35-4.8-.95V7.4c1.45.6 3.1 1.05 4.8 1.05 1.03 0 2.02-.15 2.7-.35v9.9z"/></svg>`,
      PLANNING: `<svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>`,
      DROPPED: `<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 13.41 12z"/></svg>`,
      PAUSED: `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`,
      REPEATING: `<svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.97 20 14.05 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 8.74C4.46 10.03 4 11.95 4 14c0 4.42 3.58 8 8 8v4l5-5-5-5v3z"/></svg>`,
      DEFAULT: `<svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>`
    };

    const BATCH_ANILIST_QUERY = `
      query ($ids: [Int]) {
        Page {
          media(id_in: $ids) {
            id
            format
            title {
              english
              romaji
              userPreferred
            }
            coverImage {
              extraLarge
              large
              medium
            }
          }
        }
      }
    `;

    // Inisialisasi Swiper
    const swiper = new Swiper('.mySwiper', {
      initialSlide: 0,
      spaceBetween: 0,
      speed: 300,
      on: {
        slideChange: function () {
          updateActiveTab(this.activeIndex);
        }
      }
    });

    window.switchTab = function(index) {
      swiper.slideTo(index);
    };

    function updateActiveTab(index) {
      const tabBtns = document.querySelectorAll('.tab-btn');
      tabBtns.forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
      });
    }

    function getStatusIcon(status) {
      if (!status) return STATUS_ICONS.DEFAULT;
      const key = String(status).toUpperCase();
      return STATUS_ICONS[key] || STATUS_ICONS.DEFAULT;
    }

    function maskEmail(email) {
      if (!email || !email.includes('@')) return email || '';
      const [name, domain] = email.split('@');
      if (name.length <= 3) {
        return `${name.charAt(0)}.....@${domain}`;
      }
      return `${name.substring(0, 3)}.....@${domain}`;
    }

    window.navigateTo = function(url) {
      let targetUrl = url;
      if (!/^https?:\/\//i.test(url) && !/^file:\/\//i.test(url)) {
        if (window.location.protocol === 'file:') {
          const basePath = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
          targetUrl = basePath + url;
        } else {
          targetUrl = 'file:///android_asset/' + url;
        }
      }
      if (window.Android && typeof window.Android.openBridge === 'function') {
        window.Android.openBridge(targetUrl);
      } else {
        window.location.href = targetUrl;
      }
    };

    function detachListeners() {
      if (typeof unsubscribeBookmark === 'function') {
        unsubscribeBookmark();
        unsubscribeBookmark = null;
      }
    }

    async function fetchAniListDetails(ids) {
      if (!ids || ids.length === 0) return {};
      try {
        const response = await fetch(ANILIST_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json',
          },
          body: JSON.stringify({
            query: BATCH_ANILIST_QUERY,
            variables: { ids: ids }
          })
        });
        const json = await response.json();
        const list = json?.data?.Page?.media || [];
        const map = {};
        list.forEach(item => {
          map[item.id] = item;
        });
        return map;
      } catch (e) {
        return {};
      }
    }

    function renderSkeletons(containerId) {
      const list = document.getElementById(containerId);
      if (!list) return;
      list.innerHTML = '';
      for (let i = 0; i < 6; i++) {
        const skeletonCard = document.createElement('div');
        skeletonCard.className = 'content-card';
        skeletonCard.innerHTML = `
          <div class="content-card-left">
            <div class="cover-container skeleton"></div>
            <div class="card-info">
              <div class="skeleton" style="height: 16px; width: 60%; border-radius: 4px;"></div>
              <div class="skeleton" style="height: 12px; width: 30%; border-radius: 4px; margin-top: 4px;"></div>
            </div>
          </div>
          <div class="skeleton" style="height: 32px; width: 32px; border-radius: 50%;"></div>
        `;
        list.appendChild(skeletonCard);
      }
    }

    function renderBookmarks() {
      const list = document.getElementById('bookmarkList');
      if (!list) return;
      list.innerHTML = '';

      if (!isLoggedIn) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-title">Akses Terbatas</div>
            <div class="empty-state-sub">Silakan login terlebih dahulu untuk melihat bookmark kamu.</div>
          </div>
        `;
        return;
      }

      if (allBookmarks.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-title">Tidak Ada Bookmark</div>
            <div class="empty-state-sub">Belum ada simpanan manga.</div>
          </div>
        `;
        return;
      }

      allBookmarks.forEach(item => {
        const card = document.createElement('div');
        card.className = 'content-card';
        
        const titleText = item.title?.userPreferred || item.title?.english || item.title?.romaji || 'Tanpa Judul';
        const coverUrl = item.coverImage?.medium || item.coverImage?.large || item.coverImage?.extraLarge || '';
        const formatLabel = item.format || 'MANGA';
        const statusSvg = getStatusIcon(item.status);

        card.innerHTML = `
          <div class="content-card-left">
            <div class="cover-container skeleton">
              ${coverUrl ? `<img class="cover-img" src="${coverUrl}" alt="${titleText}" loading="lazy">` : ''}
            </div>
            <div class="card-info">
              <div class="card-title">${titleText}</div>
              <div class="card-subtext">${formatLabel}</div>
            </div>
          </div>
          <div class="status-badge">${statusSvg}</div>
        `;

        const img = card.querySelector('.cover-img');
        const container = card.querySelector('.cover-container');

        if (img && coverUrl) {
          img.onload = () => {
            container.classList.remove('skeleton');
            img.classList.add('loaded');
          };
          img.onerror = () => {
            container.classList.remove('skeleton');
          };
        } else {
          container.classList.remove('skeleton');
        }

        card.addEventListener('click', () => {
          window.navigateTo(`https://mineread.vercel.app/apps/bridge/mangadetail.html?id=${item.id}`);
        });

        list.appendChild(card);
      });

      initRipples();
    }

    function listenToUserBookmarks(uid) {
      renderSkeletons('bookmarkList');

      const userMangaRef = ref(db, `save_manga/${uid}`);
      unsubscribeBookmark = onValue(userMangaRef, async (snapshot) => {
        const data = snapshot.val();
        if (!data) {
          allBookmarks = [];
          renderBookmarks();
          return;
        }

        const ids = [];
        const firebaseItems = [];

        Object.keys(data).forEach(mangaId => {
          const item = data[mangaId];
          if (item && item.status && item.status !== 'REMOVE') {
            const parsedId = parseInt(mangaId, 10);
            if (!isNaN(parsedId)) {
              ids.push(parsedId);
              firebaseItems.push({
                id: parsedId,
                status: item.status,
                updatedAt: item.updatedAt || 0
              });
            }
          }
        });

        if (ids.length === 0) {
          allBookmarks = [];
          renderBookmarks();
          return;
        }

        firebaseItems.sort((a, b) => b.updatedAt - a.updatedAt);

        const aniListDataMap = await fetchAniListDetails(ids);

        allBookmarks = firebaseItems.map(item => {
          const aniData = aniListDataMap[item.id] || {};
          return {
            id: item.id,
            status: item.status,
            updatedAt: item.updatedAt,
            format: aniData.format || 'MANGA',
            title: aniData.title || {},
            coverImage: aniData.coverImage || {}
          };
        });

        renderBookmarks();
      }, (error) => {
        console.error("Gagal mengambil data bookmark:", error);
        allBookmarks = [];
        renderBookmarks();
      });
    }

    function renderUserData(user) {
      isLoggedIn = true;
      currentUser = user;
      
      const displayName = user.displayName || user.email?.split('@')[0] || "Pengguna";
      document.getElementById('userName').innerText = displayName;
      document.getElementById('userEmail').innerText = maskEmail(user.email);

      const text = document.getElementById('authActionText');
      const icon = document.getElementById('authActionIcon');

      text.innerText = "Keluar Akun";
      icon.innerHTML = `<path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>`;
    }

    function renderGuestData() {
      isLoggedIn = false;
      currentUser = null;
      allBookmarks = [];
      
      document.getElementById('userName').innerText = "Tamu Mineplay";
      document.getElementById('userEmail').innerText = "Belum masuk akun";

      const text = document.getElementById('authActionText');
      const icon = document.getElementById('authActionIcon');

      text.innerText = "Login";
      icon.innerHTML = `<path d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/>`;

      renderBookmarks();
    }

    onAuthStateChanged(auth, (user) => {
      detachListeners();
      if (user) {
        renderUserData(user);
        listenToUserBookmarks(user.uid);
      } else {
        renderGuestData();
      }
    });

    window.addEventListener('pageshow', (event) => {
      if (auth.currentUser) {
        renderUserData(auth.currentUser);
        if (!unsubscribeBookmark) listenToUserBookmarks(auth.currentUser.uid);
      }
    });

    window.handleAuthAction = function() {
      if (isLoggedIn) {
        detachListeners();
        signOut(auth).then(() => {
          renderGuestData();
        }).catch((error) => {
          console.error("Gagal logout: ", error);
        });
      } else {
        window.navigateTo('https://mineread.vercel.app/apps/bridge/login.html');
      }
    };

    function initHeaderScrollEffect() {
      const appHeader = document.getElementById('appHeader');
      const scrollContents = document.querySelectorAll('.swiper-slide');

      scrollContents.forEach(el => {
        el.addEventListener('scroll', () => {
          if (el.scrollTop > 15) {
            appHeader.classList.add('header-scrolled');
          } else {
            appHeader.classList.remove('header-scrolled');
          }
        }, { passive: true });
      });
    }

    function initRipples() {
      const clickableItems = document.querySelectorAll('.menu-item, .btn-action, .tab-btn, .header-action-btn, .content-card');
      
      clickableItems.forEach(item => {
        item.removeEventListener('pointerdown', handleRipple);
        item.addEventListener('pointerdown', handleRipple);
      });
    }

    function handleRipple(e) {
      const item = e.currentTarget;
      const oldRipple = item.querySelector('.ripple-circle');
      if (oldRipple) oldRipple.remove();

      const rect = item.getBoundingClientRect();
      const diameter = Math.max(rect.width, rect.height);
      const radius = diameter / 2;

      let clientX = e.clientX;
      let clientY = e.clientY;

      if (e.type === 'touchstart' && e.touches && e.touches[0]) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      }

      if (clientX === undefined) clientX = rect.left + rect.width / 2;
      if (clientY === undefined) clientY = rect.top + rect.height / 2;

      const circle = document.createElement('span');
      circle.style.width = circle.style.height = `${diameter}px`;
      circle.style.left = `${clientX - rect.left - radius}px`;
      circle.style.top = `${clientY - rect.top - radius}px`;
      circle.classList.add('ripple-circle');

      item.appendChild(circle);

      setTimeout(() => {
        if (circle && circle.parentNode) circle.remove();
      }, 600);
    }

    window.addEventListener('DOMContentLoaded', () => {
      initRipples();
      initHeaderScrollEffect();
    });
  </script>
</body>
</html>
